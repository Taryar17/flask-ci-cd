name: Flask CI/CD

on:
    push:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/checkout@v4
              with:
                  python-version: "3.12"

            - name: Install Package
              run: |
                  pip install -r requirements.txt

            - name: Run Test
              run: |
                  pytest
